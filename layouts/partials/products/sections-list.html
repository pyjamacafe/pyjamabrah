{{ with . }}

<h2>contents and preview lectures ...</h2>
<div class="dropdown-container">
{{ range .sections }}
  <!-- sections list -->
  <p id="{{.id}}"></p>
  <details class="dropdown-listing" {{ .open }}>
    <summary class="dropdown-summary">
      <div class="section-name">
        {{ .section }}
      </div>
      <div class="section-meta">
        {{ .sectionDuration }}
      </div>
    </summary>
    <p class="section-description">{{.description}}</p>

    {{ range .chapters }}
    {{ partial "products/chapter-name-render.html" . }}
    {{ end }}
    <!-- use para tags for space at the end -->
    <p></p>
  </details>
{{ end }}
</div>

<script>
  /* fade the list content out before the details element closes */
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".dropdown-listing").forEach(function (details) {
      var summary = details.querySelector("summary");
      var content = Array.prototype.slice.call(details.children).filter(function (el) { return el !== summary; });
      summary.addEventListener("click", function (event) {
        if (!details.open) return;
        event.preventDefault();
        content.forEach(function (el) {
          el.style.transition = "opacity 0.25s ease";
          el.style.opacity = "0";
        });
        setTimeout(function () {
          details.removeAttribute("open");
          content.forEach(function (el) {
            el.style.opacity = "";
            el.style.transition = "";
          });
        }, 260);
      });
    });
  });
</script>

{{ end }}
