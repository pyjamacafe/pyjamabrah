{{ $theme := partial "theme-name.html" .page }}
{{ with .data }}
<link rel="stylesheet" href="{{ printf "css/%s/pitch/pitch.css" $theme | relURL}}">
<div class="pitch-container">
  {{ range .sections }}
    {{ range . }}
      {{ partial "pitch/section.html" . }}
    {{ end }}
  {{end}}
</div>
{{ if .sticky }}
  {{ partial "pitch/sticky.html" .sticky }}
{{ end }}

{{.Content}}
{{ end }}
