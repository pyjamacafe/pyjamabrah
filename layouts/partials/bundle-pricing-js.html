{{- if .pricing -}}
<script>
const libraryPricing = JSON.parse({{ .pricing | jsonify }});
const libraryDiscountPercent = {{ default "0" .sticky.discount.percent | strings.TrimSuffix "%" }};

async function getCountryCode() {
  try {
    const response = await fetch('https://ipapi.co/json/');
    const data = await response.json();
    return data.country_code || 'default';
  } catch (error) {
    return 'default';
  }
}

function formatPrice(symbol, value) {
  return symbol + Number(value).toLocaleString('en-IN', {
    minimumFractionDigits: 0,
    maximumFractionDigits: 2
  });
}

async function updateLibraryPrices() {
  if (!libraryPricing || !libraryPricing.length) return;
  const country = await getCountryCode();
  const price = libraryPricing.find(p => p.region === country) || libraryPricing.find(p => p.region === 'default');
  if (!price) return;
  const discounted = price.original * (1 - libraryDiscountPercent / 100);
  document.querySelectorAll('.bundle-cta-original').forEach(el => {
    el.textContent = formatPrice(price.symbol, price.original);
  });
  document.querySelectorAll('.bundle-cta-discounted').forEach(el => {
    el.textContent = formatPrice(price.symbol, discounted);
  });
}

updateLibraryPrices();
</script>
{{- end -}}
