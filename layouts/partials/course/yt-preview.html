{{ with . }}

<div class="bundle-landing-course-details-dialog-section-container bundle-landing-yt-container">
  <div class="yt-preview-placeholder" style="position: relative; aspect-ratio: 16 / 9; width: 100%; overflow: hidden; background: #000; cursor: pointer;">
    <img class="yt-preview-thumb" data-src="https://i.ytimg.com/vi/{{.}}/maxresdefault.jpg" decoding="async" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/{{.}}/hqdefault.jpg'" alt="Preview thumbnail" style="width: 100%; height: 100%; object-fit: cover; display: block;"/>
    <span class="yt-preview-play" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 64px; color: rgba(255, 255, 255, 0.9); pointer-events: none;"><i class="bi bi-play-circle-fill"></i></span>
    <iframe class="yt-preview-frame" title="Preview Lecture" data-src="https://www.youtube.com/embed/{{.}}?autoplay=1&amp;muted=0&amp;loop=1&amp;controls=1&amp;modestbranding=0&amp;rel=0&amp;playinline=1&amp;playlist={{.}}" loading="lazy" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture;" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: none;"></iframe>
  </div>
</div>

{{ end }}
