{{ define "main" }}
<link rel="stylesheet" href="{{ "css/pitch/pitch.css" | relURL}}">
<div class="pitch-container">
  {{ range .Params.sections }}
    {{ range . }}
      {{ partial "pitch/section.html" . }}
    {{ end }}
  {{end}}
</div>
{{ if .Params.sticky }}
  {{ partial "pitch/sticky.html" .Params.sticky }}
{{ end }}

{{.Content}}
{{ end }}
