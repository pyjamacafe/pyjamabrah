minifyOutput: true

# ignore these files
ignoreFiles:
  - "content/posts/README.md"
  - "content/posts/sample/"

menu:
  main: # Change menu as needed
    # - identifier: posts
    #   name: Blog
    #   url: /posts
    #   weight: 1
