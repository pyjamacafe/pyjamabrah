markup:
  highlight:
    codeFences: true     # Enables fenced code block highlighting (already set)
    noClasses: false     # Use markdown classes (not inline styles) so we can theme via CSS
    lineNos: true        # Adds line numbers to code blocks
    lineNumbersInTable: false  # Render line numbers inline (no table wrapper)
    tabWidth: 4
    anchorLineNos: true
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["$$", "$$"]
            - ["\\[", "\\]"]
          inline:
            - ["$", "$"]
            - ["\\(", "\\)"]

params:
  subtitle: "You are not late. You are loading!"
