sections:
  - section:
    - details:
        type: "half"
        video: "https://raw.githubusercontent.com/pyjamacafe/cache/master/pitch/demo-hands-on.webm"
        caption: "a clip from the lecture on implementing a scheduler in assembly for the ARM M CPU."
    - details:
        type: "half"
        title: "Mastering EMBEDDED SYSTEMS!"
        texts:
          - "We are on a mission to lowering the barrier to learning Embedded Systems, Mastering it and empowering you to build!"
  - section:
    - details:
        type: "full"
        title: "Key Skills?"
        subtitle: "the 20% to deal with 100% of the stuff"
    - details:
        type: "break"
    - details:
        type: "full"
        features:
          - card:
            title: "C Language"
            img: "/images/home/features/c.png"
            text: "Almost all of firmware and systems software is written in the C Language. It is the work horse of the Embedded Systems and Semiconductor industry."
            more: ""
          - card:
            title: "CPUs (32 Bit ARM or RISC-V)"
            img: "/images/home/features/cpu.png"
            text: "Almost all of the electronics you see around you will have an embedded CPU in it that is taking all the decisions and driving the system to different states."
            more: ""
          - card:
            title: "OS primitives"
            img: "/images/home/features/os.png"
            text: "Electronics that involve many inputs and outputs tend to use an OS for the state management."
            more: ""
          - card:
            title: "Utilities and Tools"
            img: "/images/home/features/tools.png"
            text: "To go from C code and the hardware configuration to the compiled binary that needs to be loaded on the target there are several tools and utilities that are useful. You need to know those to be able to drive things and lead teams."
            more: ""
          - card:
            title: "Kernel Drivers"
            img: "/images/home/features/dd.png"
            text: "Senior engineers deal with complex systems and are able to reason deeply about the system. At the scale more or less a Higher Level Operating System (Linux/Android/iOS) is involved and the hardware management is done through device drivers. A Senior/Staff level engineer understands and manages that complexity."
            more: ""
  - section:
    - details:
        type: "full"
        title: "Skill Vs Proficiency"
        subtitle: "Peel the abstractions, learn and master how the machine works. Control it!"
        stretchedimg: "/images/home/skill-meter.svg"
