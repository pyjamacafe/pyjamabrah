# mandatory ID for the course
id: "ldd-103"
type: "pjcafe"

# mandatory title, cover and subtitle
title: "Linux Device Drivers: Kernel Facilities & Helper Functions"
subtitle: "Controlling the Hardware through device drivers in Linux."
cover: "/images/courses/kernel-facilities.png"

# mandatory introduction
introduction:
  - "The Linux kernel doesn't use the Standard C Library and implements the functions as it's own modern libraries. This course is focused on exploring the facilities and helper functions the kernel provides to manage data and different activities from the driver."

# mandatory badges
badges:
  - Bestseller
  - Beginner
  - Intermediate
  - Advance

# Mandatory Rating
rating: 5

# Optional, number of students
enrolled: 3000+

