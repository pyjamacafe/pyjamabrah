learnings:
- Understand AUTOSAR architecture from an ICC and configuration-class perspective.
- Classify BSW modules and apply BSW interaction rules correctly.
- Understand AUTOSAR OS alarms, schedule tables, event mechanisms, timing, memory protection, and multicore OS features.
- Understand the AUTOSAR ComStack architecture, PDU terminology, and CAN frame structure.
- Work through CAN Driver, CAN Interface, and CAN Transport Protocol (ISO 15765-2) behavior in detail.
- Trace PDU routing paths and configure the COM module and COM stack via ARXML.
- Understand signal packing, endianness, COM transfer properties, update bits, and COM filtering.
- Understand IPDU groups, IPDU multiplexing, and signal gateway concepts.
- Understand COMM and Network Management (NM) basics, and LIN/Ethernet stack architecture.
- Understand EcuM and BswM, and the EcuM state machine.
- Trace EcuM startup/shutdown sequences, wakeup sources, and sleep modes.
- Configure BswM completely and compare BswM vs EcuM mode management.
- Understand the memory stack architecture and the EEPROM path.
- Understand NVM block types, basic storage objects, and the NVM API.
- Configure NVM job processing, callbacks, and ARXML settings.
- Understand MemIF, FEE, EA, and memory driver relationships.
- Trace a full memory stack read/write flow with ARXML configuration.
- Understand diagnostics architecture - UDS over CAN and ISO 14229 services.
- Understand session management, security access, and other diagnostic services.
- Understand DCM internal architecture, buffer handling, multi-request protocol, and timing parameters.
- Configure DCM and trace diagnostic flow and integration scenarios.
- Understand DEM architecture, core functionality, and DTC examples.
- Understand event debouncing, event reporting, event memory, aging, freeze frames, and extended data records.
- Understand DEM interfaces, OBD in DEM, and FIM.
- Understand UDS flash programming and the flashing workflow.
- Understand the Crypto Stack architecture, automotive use cases, and the CSM lifecycle.
- Understand AES, hash functions, and MAC generation and verification.
- Understand RSA (asymmetric) key management.
- Configure CryIF and Crypto Driver, and get introduced to SecOC.
- Understand why SecOC is needed and its architecture.
- Understand SecOC TX and RX flows.
- Understand the Freshness Value Manager (FVM) strategy.
- Configure secure IPDU layout and SecOC-COM integration via ARXML.
- Get an overview of MCAL - drivers, standards, architecture, and the Port/DIO driver.
- Understand the ADC driver and other MCAL modules.
- Consolidate the full BSW picture and plan a learning roadmap forward.
