learnings:
- Understand CAN network topology, including nodes, controllers, transceivers, and the bus.
- Understand CAN bus voltage levels and dominant/recessive logic.
- Understand the CAN communication principle end to end.
- Understand bit segments, time quanta, and baud rate calculation.
- Understand hard synchronization at Start of Frame (SOF) and resynchronization using the Synchronization Jump Width (SJW).
- Understand CAN frame types and the structure of Standard and Extended Data Frames.
- Understand addressing and acceptance filtering.
- Understand bit stuffing and why it's needed.
- Understand the Remote Frame, Error Frame, and Overload Frame.
- Understand Positive and Negative Acknowledgement behavior.
- Understand bitwise arbitration and how bus access is resolved.
- Understand Bit Error detection, including CSMA/CD behavior.
- Understand Stuff Error, CRC Error, Form Error, and ACK Error detection.
- Understand NRZ coding and twisted-pair signaling for data protection.
- Understand bus termination and its role in signal integrity.
- Understand error handling, error tracking, and the CAN error state machine, including the Babbling Idiot scenario.
- Understand why CAN FD exists and the problems it solves.
- Understand the Bit Rate Switch (BRS) mechanism.
- Understand the 64-byte payload and DLC encoding in CAN FD.
- Understand CRC-17/21 and the Error State Indicator in CAN FD.
