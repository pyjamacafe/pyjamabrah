learnings:
- Understand the C memory model and how it underpins AUTOSAR software design.
- Trace the booting sequence and the role of the startup file in embedded systems.
- Analyze memory segments and control layout through the linker.
- Understand stack memory behavior and how to analyze it in practice.
- Master pointer fundamentals, pointer arithmetic, and arrays of pointers.
- Apply AUTOSAR-specific pointer and type-system conventions, including typedefs for abstraction.
- Use storage classes and type qualifiers the way AUTOSAR code expects.
- Master preprocessor directives, conditional compilation, and AUTOSAR versioning schemes.
- Design structs for AUTOSAR configuration, including padding, alignment, and bitfields.
- Understand unions and iterate safely over arrays of structures.
- Understand translation units, linkage basics, and header file practices.
- Manage circular dependencies and structure AUTOSAR modules correctly.
- Differentiate external and internal linkage in multi-module AUTOSAR projects.
- Build function-pointer-based abstractions - dispatch tables, jump tables, strategy and factory patterns.
- Implement multiple callbacks per event using observer-style callback arrays.
- Master single and multi-level pointer indirection, including const double pointers.
- Understand AUTOSAR MemMap mechanisms and code/var/const/config sections.
- Apply compiler-specific pragmas and attributes correctly.
- Handle multicore scenarios and reentrant function design.
- Detect non-reentrant patterns and apply reentrancy guards and critical sections.
- Understand ISR categories, ISR vs normal function behavior, and safe early returns from ISRs.
- Work with MMIO - volatile usage, typecasting, and bitwise operations for hardware registers.
- Pack and unpack signals for protocol data, including AUTOSAR signal protection and endianness handling.
- Apply defensive programming and MISRA-C practices - null pointer validation, array bounds, and return value checks.
