learnings:
- Understand why AUTOSAR exists and what legacy development problems it solves.
- Trace the evolution from OSEK/VDX to Classic AUTOSAR and map the inherited concepts.
- Understand the AUTOSAR Consortium's role and the layered AUTOSAR architecture.
- Understand BSW structure at a high level and trace a CAN dataflow example end to end.
- Navigate AUTOSAR documentation and the AUTOSAR data-exchange format.
- Understand the practical workflow of NVM within the AUTOSAR ecosystem.
- Understand the AUTOSAR development flow and configuration classes.
- Understand RTE generation and top-down, bottom-up, and round-trip workflows.
- Differentiate the AUTOSAR tool chain landscape, authoring tools vs BSW tools, and static vs generated code.
- Set up an AUTOSAR metamodel environment and use autosarfactory for hands-on modelling.
- Understand AUTOSAR application datatype categories and configurations.
- Understand implementation datatypes, base types, and data prototypes with hands-on data type modelling.
- Understand AUTOSAR metamodel fundamentals and ARXML design principles/model hierarchy.
- Understand the Virtual Functional Bus (VFB), ports, and component prototypes.
- Master AUTOSAR interface types - Sender-Receiver, Client-Server, Parameter, NV, Mode-Switch, and Trigger.
- Work through complete interface integration examples and interface design demos.
- Understand SWC types, including Complex Device Drivers (CDD), and port modelling.
- Understand connector types and best practices, including assembly and delegation connectors.
- Understand runnable entities and internal behavior, including their C implementation.
- Master Inter-Runnable Variables (IRV), Exclusive Areas, and Per-Instance Memory (PIM).
- Work through a speed-controller case study covering runnable/event relationships and all RTE event types.
- Understand DRE, Error Events, OIE, Init Events, Mode-Switch Events, Internal Trigger Events, and Background Events.
- Understand event scheduling, event type selection, and the asynchronous client-server pattern.
- Apply the RTE API for interfacing and defensive error-handling patterns.
- Generate RTE and inspect the resulting C code skeleton through hands-on demos.
