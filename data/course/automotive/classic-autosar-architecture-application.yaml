- 'Embedded and Systems Engineers: Developers moving from general embedded/firmware work into the AUTOSAR ecosystem.'
- 'Tool and Integration Engineers: Engineers working with ARXML, authoring tools, and RTE generation who need a strong conceptual
  foundation.'
- Students from Electrical, Electronics and Computer Science Engineering disciplines
