# mandatory ID for the course
id: "freertos101"

# mandatory title, cover and subtitle
title: "FreeRTOS - Teardown and Porting"
subtitle: "Porting the FreeRTOS kernel to new target from scratch."
cover: "/images/courses/freeRTOS-101.png"

# mandatory introduction
introduction:
  - "Learn FreeRTOS kernel by tearing it down to it's bare minimum and doing a port for a new target from scratch. This includes booting the CPU from scratch and placing the code in memory manually."

# mandatory badges
badges:
  - Bestseller
  - Beginner
  - Intermediate
  - Advance

# Mandatory Rating
rating: 5

# Optional, number of students
enrolled: 3000+

