# mandatory ID for the course
id: "ldd-102"
type: "pjcafe"

# mandatory title, cover and subtitle
title: "Linux Device Drivers (102)"
subtitle: "Controlling the Hardware through device drivers in Linux."
cover: "/images/courses/ldd-102.png"

# mandatory introduction
introduction:
  - "Course on writing and understanding how the Linux Device Drivers controls real hardware. In this course, we write a kernel driver for the GPIO port of Raspberry Pi - 4."

# mandatory badges
badges:
  - Bestseller
  - Beginner
  - Intermediate
  - Advance

# Mandatory Rating
rating: 5

# Optional, number of students
enrolled: 3000+

contents:
  - section:
      title: "Trailer"
      description: "A quick demo of a device driver written from scratch controlling the GPIO hardware directly."
      chapters:
        - chapter:
            title: "Driver Blinking the LED"
            preview: "ZA1JnZSXAT0"
  - section:
      title: "Introduction, Hardware, and SoC Boot flow"
      description: "This section introduces the hardware components and the boot flow for the SoC powering the Raspberry-Pi 4B. To prove the point we boot a baremetal firmware that prints on the UART."
      chapters:
        - chapter:
            title: "Hardware and Expectations"
        - chapter:
            title: "Demo - Baremetal Boot"
        - chapter:
            title: "The generic Boot flow for SoCs"
        - chapter:
            title: "Try it yourself - setup the SD Card"
        - chapter:
            title: "Raspberry-Pi & WCH Connection"
            type: "file"
  - section:
      title: "Setup and Boot the Raspberry Pi OS"
      description: "Moving away from the baremetal boot, we prepare the SD-Card and flash a Linux image that we will develop and the load our device driver."
      chapters:
        - chapter:
            title: "Reasons to use a OS image from RPi"
        - chapter:
            title: "Imaging the SD Card with RPi OS"
        - chapter:
            title: "Boot and debug the configuration"
        - chapter:
            title: "Login - ssh into the Rpi"
        - chapter:
            title: "Setting up VS Code to work over ssh"
  - section:
      title: "Writing and understanding a simple driver"
      description: "Write a quick-n-dirty GPIO driver to turn the LED ON/OFF. Reason about the character driver."
      chapters:
        - chapter:
            title: "LED toggle - Crude driver"
        - chapter:
            title: "The driver structure"
        - chapter:
            title: "Lectures being recorded."
