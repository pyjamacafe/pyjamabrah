        - chapter:
            title: "Operators and practical aspects of Bit Manipulation"
        - chapter:
            title: "Bit Masking, Setting and Clearing Bits"

  - section:
      title: "Introduction"
      description: "Understanding the vocabulary used in describing CPU architectures."
      chapters:
        - chapter:
            title: "ARM CPU Architectures"
        - chapter:
            title: "Micro Architecture Vs Architecture"

  - section:
      title: "How to learn and master CPUs"
      description: "Learn ways to master any CPU architecture."
      chapters:
        - chapter:
            title: "Mental model of CPU Memory interactions"
        - chapter:
            title: "How to master CPU - Different models to learn"

  - section:
      title: "Mental Models and How to Use them"
      description: "Explore how to think and reason about the CPU internals as a Software Engineer."
      chapters:
        - chapter:
            title: "Programmers model - Register Set"
        - chapter:
            title: "Modes and Privileges"

  - section:
      title: "CPU boot-up and Register Set"
