introduction:
- '**Note:** This is a `Partner Course` and NOT included in the **[Library Access](/library)**!'
- This course introduces the role of middleware in modern automotive embedded systems, covering architectures, real-world
  examples, and controller vs processor-based designs. Learn driver vs middleware code level differences, Covering the middleware
  example with a SOME/IP case study, OS essentials required for middleware development, why C++ dominates middleware development,
  and a clear learning roadmap for aspiring embedded middleware engineers.
