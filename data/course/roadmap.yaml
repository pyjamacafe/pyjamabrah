# mandatory ID for the course
id: "roadmap"

# mandatory title, cover and subtitle
title: "Roadmap to learning Embedded Systems"
cover: "/images/courses/howtoembedded.png"
subtitle: "An introduction to the field of Embedded Software Engineering."

# mandatory introduction
introduction:
  - "This short course introduces the field of embedded systems, how to pursue it and what are the some of the possible journeys."

# mandatory badges
badges:
  # - Bestseller
  - Beginner
  - Intermediate
  # - Advance

# Mandatory Rating
rating: 4.9

# Optional, number of students
enrolled: 3000+

# mandatory, content
contents:
  - section:
      title: "Understanding Embedded Systems"
      description: "An overview of what Embedded Systems is and what the basics one needs to know."
      chapters:
        - chapter:
            title: "what is embedded systems and how it relates to EE, ECE and CS"
            type: "video"
        - chapter:
            title: "What is firmware and Systems Engineering"
            type: "video"
  - section:
      title: "Firmware Engineering"
      description: "Dive into the details of what Firmware engineering means and what are the skills one should have."
      chapters:
        - chapter:
            title: "Understanding What Firmware engineering is"
            type: "video"
        - chapter:
            title: "Memory Map and the Programmer's model"
            type: "video"
        - chapter:
            title: "State Machines and OS Primitives"
            type: "video"
        - chapter:
            title: "Roles and Exploring listing"
            type: "video"
  - section:
      title: "Systems Software Engineering"
      description: "Understand the meaning of what System is and what systems programming means in the context of Embedded systems software."
      chapters:
        - chapter:
            title: "HLOS, Application Grade CPU and Virtual Memory"
            type: "video"
        - chapter:
            title: "Roles and Skills"
            type: "video"
        - chapter:
            title: "Exploring Opportunities and Skillset"
            type: "video"
