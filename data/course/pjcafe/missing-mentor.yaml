  - workshops:
  - cheatSheet:
  - caseStudy:
  - exerciseChallenge:
  - projectCount:
  - certificate:
  - freeUpdates:
  - feature: "Early life and studies"
  - feature: "College to industry transition"
  - feature: "Internship Experience at Intel"
  - feature: "Interview experiences"

videoMessage: ""
learnings:
  - "How a career in Embedded Systems can unfold over time."
  - "Dealing with financial pressures and ambiguity as a student."
  - "Navigating internships, rejections and full-time offers."
  - "What an internship at Intel looks like: from interview to project."
  - "The transition from college, a first job to quitting and pursuing a masters."
  - "Real interview experiences and the lessons from them."

sampleCertificate:
difference:
  - "First-hand, honest retelling of a career journey."
  - "Unscripted conversations, pressures and decisions included."
  - "Covers rejections and setbacks, not just wins."
  - "Real internship and interview experiences told in detail."

instructors:
  - "piyush"
requirements:
  - "Intended for students."
  - "Open mind."
audience:
  - Students curious about a career in Embedded Systems.
  - Early-career engineers exploring the industry.
  - Anyone interested in internship and interview experiences.
faqs: pyjamacafe

# mandatory, content
contents:
  - section:
      title: "Introduction And Background"
      description: "Reflecting on the early years, the personal background and the pressures that shaped the journey."
      chapters:
        - chapter:
            title: "What to expect"
            type: "video"
            duration: "3min 36s"
        - chapter:
            title: "Toymaker - My personal background"
            type: "video"
            duration: "31min 24s"
        - chapter:
            title: "Financial Pressures"
            type: "video"
            duration: "13min 22s"
        - chapter:
            title: "More pressures, seeking validation and first job"
            type: "video"
            duration: "36min 37s"
        - chapter:
            title: "Quitting the Job, GATE and masters Program"
            type: "video"
            duration: "26min 15s"
  - section:
      title: "Time at Intel"
      description: "The internship journey at Intel - from the interview to working on real projects."
      chapters:
        - chapter:
            title: "Intel: Internship Interview"
            type: "video"
            duration: "21min 42s"
        - chapter:
            title: "GNSS: Internship Project - Memory Manager"
            type: "video"
            duration: "20min 51s"
        - chapter:
            title: "Rejections - Mathwork, Intel and Full time offer"
            type: "video"
            duration: "25min 42s"
        - chapter:
            title: "Bluetooth Software and RF"
            type: "video"
            duration: "21min 4s"
  - section:
      title: "Other Opportunities"
      description: "Other interview adventures and opportunities explored along the way."
      chapters:
        - chapter:
            title: "ARM interview - Adventures"
            type: "video"
            duration: "36min 19s"

