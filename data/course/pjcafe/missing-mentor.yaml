# mandatory ID for the course
id: "missing-mentor"
type: "pjcafe"
sell: false

weight: "1"

# mandatory title, cover and subtitle
title: "The Missing Mentor"
cover: "/images/courses/missing-mentor.png"
subtitle: "Dealing with and thriving in ambiguity!"

# mandatory introduction
introduction:
  - "Collection of stories on how to become a Embedded Systems engineer.
    Vlog style recording from Piyush, reflecting back on his journey in the
    field of Embedded Systems. Includes interview experiences, pressures and
    the decisions taken along the way."

# mandatory badges
badges:
  # - Bestseller
  - Beginner
  - Intermediate
  # - Advance
  - Free

# Mandatory Rating
rating: 5

# Optional, number of students
enrolled: 3000+


default_cta: &defaults
  - cta:
    link: "https://courses.pyjamacafe.com/web/checkout/69ae2e69b33a5bc39a22608f"
    text: "Start for Free!"
    primary: true
sticky:
  text: "Start the journey of Learning Embedded Systems."
#   discount:
#     code:
#     percent:
  ctas: *defaults

date: 14 Mar 2026
language: "English"
access: "365 day"
