            title: "Understanding What Firmware engineering is"
            type: "video"
        - chapter:
            title: "Memory Map and the Programmer's model"
            type: "video"
        - chapter:
            title: "State Machines and OS Primitives"
            type: "video"
        - chapter:
            title: "Roles and Exploring listing"
            type: "video"
  - section:
      title: "Systems Software Engineering"
      description: "Understand the meaning of what System is and what systems programming means in the context of Embedded systems software."
      chapters:
        - chapter:
            title: "HLOS, Application Grade CPU and Virtual Memory"
            type: "video"
        - chapter:
            title: "Roles and Skills"
            type: "video"
        - chapter:
            title: "Exploring Opportunities and Skillset"
            type: "video"

