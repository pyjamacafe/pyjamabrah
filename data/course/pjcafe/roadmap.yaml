contents:
  - section:
      title: "Understanding Embedded Systems"
      description: "An overview of what Embedded Systems is and what the basics one needs to know."
      chapters:
        - chapter:
            title: "what is embedded systems and how it relates to EE, ECE and CS"
            type: "video"
        - chapter:
            title: "What is firmware and Systems Engineering"
            type: "video"
  - section:
      title: "Firmware Engineering"
      description: "Dive into the details of what Firmware engineering means and what are the skills one should have."
      chapters:
