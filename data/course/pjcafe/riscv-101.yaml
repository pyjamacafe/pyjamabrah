  - "Learning the absolute essentials of embedded systems, the RISC-V architecture and reasoning about the lower level details like the programmer's model, Assembly and C programming."
  - "This course introduces you to the underlying mechanics of how the CPU boots up, the role of the ISA and the ABI in all of this."

