# mandatory, content
contents:
  - section:
      title: "Mental Models"
      description: "Build the mental models of the CPU and memory that let you reason about the lower level details of a system."
      chapters:
        - chapter:
            title: "Repository and Code"
            type: "file"
        - chapter:
            title: "Introduction and Expectations"
        - chapter:
            title: "System as a CPU and Memory Interactions"
        - chapter:
            title: "The model of the CPU"
        - chapter:
            title: "The model of the memory"
        - chapter:
            title: "Putting it all together"

  - section:
      title: "The Instruction Set Architecture"
      description: "Understand the RISC-V instruction set architecture, its specifications, extensions and the ABI."
      chapters:
        - chapter:
            title: "The RISC-V backstory"
        - chapter:
            title: "Exploring the RISC-V Unprivileged Spec"
        - chapter:
            title: "Extensions and the ABI"
        - chapter:
            title: "The Privileged Specification"

  - section:
      title: "Hardware Design & Simulation"
      description: "Design a single-cycle CPU in an HDL, run simulations and explore the waveforms."
      chapters:
        - chapter:
            title: "Motivation to Hardware Design"
        - chapter:
            title: "What is HDL - Hardware Description Language"
        - chapter:
            title: "Single Cycle CPU implementation"
        - chapter:
            title: "Simulation run and Test-bench walkthrough"
        - chapter:
            title: "Exploring the Waveforms"
        - chapter:
            title: "Makefiles and Details of Simulation"

  - section:
      title: "Boot code and debugging"
      description: "Understand how CPUs boot, the compilation flow and how to debug and confirm code execution."
      chapters:
        - chapter:
            title: "Ways in which CPUs boot"
        - chapter:
            title: "The Compilation flow - as, ld"
        - chapter:
            title: "Basics of assembly language (assembler)"
        - chapter:
            title: "Using GDB to debug and confirm code execution"

  - section:
      title: "Conclusion and Next"
      description: "Connect the concepts to the bigger picture of a System on Chip and where to go next."
      chapters:
        - chapter:
            title: "The idea of SoC"
        - chapter:
            title: "Memory mapped IO and Address Space"
        - chapter:
            title: "Where to next"
