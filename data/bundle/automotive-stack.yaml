learnings:
  - Understand the role of middleware in automotive embedded systems and how it differs from driver-level code.
  - Understand vehicle E/E architecture, sensors, actuators, and powertrain systems at a system level.
  - Master the CAN protocol - bit timing, framing, arbitration, error detection, and CAN FD.
  - Understand the C memory model, startup sequence, and linker behavior as used in AUTOSAR Classic software.
  - Apply AUTOSAR-specific C patterns - typedefs, storage classes, dispatch tables, and MemMap sections.
  - Understand reentrancy, ISR handling, and MISRA-aligned defensive programming for AUTOSAR C code.
  - Understand why AUTOSAR exists, its layered architecture, and its development methodology.
  - Navigate the AUTOSAR metamodel, ARXML, and configuration workflows using real tooling.
  - Understand VFB, ports, interfaces, SWC types, and connector patterns.
  - Configure runnable entities, IRVs, Exclusive Areas, and Per-Instance Memory (PIM), and generate RTE.
  - Understand the AUTOSAR OS, communication stack, and ECU state management (EcuM/BswM).
  - Configure the AUTOSAR memory stack (NVM/MemIF/FEE/EA) end to end.
  - Understand UDS-based diagnostics, DCM, and DEM architecture and configuration.
  - Understand the AUTOSAR Crypto Stack, SecOC, and secure communication concepts.
  - Get an overview of MCAL drivers and how they connect to the rest of the BSW stack.
  - Understand the complete C++ compilation pipeline, memory layout, and symbol resolution.
  - Inspect binaries using professional tools like nm, objdump, and readelf.
  - Master object lifetime, RAII, move semantics, and RVO for efficient middleware code.
  - Master virtual functions, vtables, templates, and function-pointer-based abstractions in C++.
  - Translate high-level C++ constructs into assembly-level mental models for performance-critical automotive software.

difference:
  - Purpose-built path for the Automotive Embedded and AUTOSAR ecosystem, not a generic embedded curriculum.
  - Goes from system-level vehicle electronics down to ARXML configuration and C/C++ binary internals.
  - Real AUTOSAR methodology, metamodel, and RTE workflows, not just theory slides.
  - Dedicated CAN protocol foundation before diving into the AUTOSAR communication stack.
  - Covers the full BSW breadth - OS, ComStack, Memory, Diagnostics, Crypto/SecOC, and MCAL.
  - C++ internals taught specifically through a middleware and embedded lens.
  - Connects every concept to real automotive and middleware use cases.
  - Learn at your own pace with lifetime-style access for the bundle duration.

