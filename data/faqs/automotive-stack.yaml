- "How is this bundle different from the Library Access?"
- This bundle combines all the partner courses in one place. The partner courses are created and delivered by industry experts who are not core members of the Pyjama Cafe team, so they are NOT included in the Library Access and are sold separately. This bundle packages all of them together.
- "Do I get all the partner courses with this single purchase?"
- Yes. The bundle grants access to all the partner courses listed on this page.
- "Is this recommended for beginners?"
- Yes! The courses are taught as if the learner has no idea about the subject.
- "Do I need a special machine configuration to take these courses?"
- No!
- "Can I change my email-id post purchase?"
- As much as we'd like to support that, your account will be linked to your email-id post purchase.
- "What name will be printed on the Certificate?"
- The name you use on the platform will be printed as is on the Certificate when it is generated.